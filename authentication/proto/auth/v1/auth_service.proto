syntax = "proto3";

package auth.v1;

option go_package = "github.com/nimbo1999/financeiro/authentication/pkg/grpc/auth/v1";

// AuthService provides gRPC methods for authentication operations
service AuthService {
  // ValidateToken validates a JWT token and returns user context
  rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);

  // HealthCheck returns the health status of the service
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
}

// ValidateToken request and response
message ValidateTokenRequest {
  string token = 1;
}

message ValidateTokenResponse {
  bool valid = 1;
  UserContext user_context = 2;
  string error_message = 3;
}

// UserContext contains user information extracted from the token
message UserContext {
  string user_id = 1;
  string email = 2;
}

// Health check messages
message HealthCheckRequest {}

message HealthCheckResponse {
  enum Status {
    UNKNOWN = 0;
    SERVING = 1;
    NOT_SERVING = 2;
    SERVICE_UNKNOWN = 3;
  }
  Status status = 1;
  string message = 2;
}