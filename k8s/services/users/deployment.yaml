apiVersion: apps/v1
kind: Deployment
metadata:
  name: users
  namespace: financeiro
  labels:
    app: users
spec:
  replicas: 2
  selector:
    matchLabels:
      app: users
  template:
    metadata:
      labels:
        app: users
    spec:
      containers:
        - name: users
          image: nimbo/users:latest
          ports:
            - containerPort: 80
              name: http
            - containerPort: 50051
              name: grpc
          env:
            - name: HTTP_PORT
              value: "80"
            - name: GRPC_PORT
              value: "50051"
            - name: POSTGRES_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: users-db-url
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secrets
                  key: url
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: "42Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
              cpu: "100m"
