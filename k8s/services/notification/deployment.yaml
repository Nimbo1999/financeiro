apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification
  namespace: financeiro
  labels:
    app: notification
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification
  template:
    metadata:
      labels:
        app: notification
    spec:
      containers:
        - name: notification
          image: nimbo/notification:latest
          ports:
            - containerPort: 80
              name: http
          env:
            - name: HTTP_PORT
              value: "80"
            - name: POSTGRES_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: notification-db-url
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secrets
                  key: url
            - name: SMTP_PORT
              valueFrom:
                secretKeyRef:
                  name: email-secrets
                  key: smtp_port
            - name: SMTP_FROM
              valueFrom:
                secretKeyRef:
                  name: email-secrets
                  key: smtp_from
            - name: SMTP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: email-secrets
                  key: smtp_username
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: email-secrets
                  key: smtp_password
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: "42Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
              cpu: "100m"
