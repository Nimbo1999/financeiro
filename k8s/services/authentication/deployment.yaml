apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentication
  namespace: financeiro
  labels:
    app: authentication
spec:
  replicas: 2
  selector:
    matchLabels:
      app: authentication
  template:
    metadata:
      labels:
        app: authentication
    spec:
      containers:
        - name: authentication
          image: docker.io/nimbo/authentication:latest
          ports:
            - containerPort: 80
              name: http
            - containerPort: 50051
              name: grpc
          env:
            - name: HTTP_PORT
              value: "80"
            - name: GRPC_PORT
              value: "50051"
            - name: POSTGRES_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: auth-db-url
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secrets
                  key: url
            - name: USER_GRPC_ADDRESS
              value: "users:50051"
          volumeMounts:
            - name: jwt-keys
              mountPath: /app/certs
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "200m"
      volumes:
        - name: jwt-keys
          secret:
            secretName: jwt-keys
