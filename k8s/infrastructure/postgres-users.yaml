# Postgres Deployment and Service for Users Database
# ======================================================================
# Deployment for Users Database
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-users
  namespace: financeiro
  labels:
    app: postgres
    database: users
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
      database: users
  template:
    metadata:
      labels:
        app: postgres
        database: users
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine3.22
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: users-db-name
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: users-db-user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: users-db-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              memory: "250Mi"
              cpu: "80m"
            limits:
              memory: "512Mi"
              cpu: "150m"
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - $(POSTGRES_USER)
                - -d
                - $(POSTGRES_DB)
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - $(POSTGRES_USER)
                - -d
                - $(POSTGRES_DB)
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-users-pvc
---
# Postgres Service for Users Database
apiVersion: v1
kind: Service
metadata:
  name: postgres-users
  namespace: financeiro
  labels:
    app: postgres
    database: users
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgres
  selector:
    app: postgres
    database: users
