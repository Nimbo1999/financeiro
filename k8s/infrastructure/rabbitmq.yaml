apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: financeiro
  labels:
    app: rabbitmq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3-management-alpine
          ports:
            - containerPort: 5672
              name: amqp
            - containerPort: 15672
              name: management
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: rabbitmq-username
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: rabbitmq-password
            - name: RABBITMQ_ERLANG_COOKIE
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: rabbitmq-erlang-cookie
          volumeMounts:
            - name: rabbitmq-storage
              mountPath: /var/lib/rabbitmq
          resources:
            requests:
              memory: "250Mi"
              cpu: "150m"
            limits:
              memory: "512Mi"
              cpu: "200m"
          startupProbe:
            exec:
              command:
                - rabbitmqctl
                - ping
            initialDelaySeconds: 10      # Aguardar 10s antes de começar a verificar
            periodSeconds: 10             # Verificar a cada 10s
            timeoutSeconds: 5             # Timeout de 5s por verificação
            failureThreshold: 30          # 30 tentativas = 300s (5 minutos) para iniciar
            successThreshold: 1           # Apenas 1 sucesso necessário
          # LIVENESS PROBE - Verifica se está "vivo" (só roda depois do startup)
          livenessProbe:
            exec:
              command:
                - rabbitmqctl
                - status
            initialDelaySeconds: 0        # Não precisa delay, startup probe já garantiu
            periodSeconds: 30             # Verificar a cada 30s
            timeoutSeconds: 10            # Timeout de 10s
            failureThreshold: 3           # 3 falhas = restart
          # READINESS PROBE - Verifica se está pronto para receber tráfego
          readinessProbe:
            exec:
              command:
                - rabbitmqctl
                - check_port_connectivity
            initialDelaySeconds: 0        # Não precisa delay, startup probe já garantiu
            periodSeconds: 10             # Verificar a cada 10s
            timeoutSeconds: 5             # Timeout de 5s
            failureThreshold: 3           # 3 falhas = marca como not ready
      volumes:
        - name: rabbitmq-storage
          persistentVolumeClaim:
            claimName: rabbitmq-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: financeiro
  labels:
    app: rabbitmq
spec:
  type: ClusterIP
  ports:
    - port: 5672
      targetPort: 5672
      protocol: TCP
      name: amqp
    - port: 15672
      targetPort: 15672
      protocol: TCP
      name: management
  selector:
    app: rabbitmq
---
# NodePort para acessar Management UI externamente
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-management
  namespace: financeiro
  labels:
    app: rabbitmq
spec:
  type: NodePort
  ports:
    - port: 15672
      targetPort: 15672
      nodePort: 30672
      protocol: TCP
      name: management
  selector:
    app: rabbitmq
