name: "Build Docker Image"
description: "Build and push Docker image"

inputs:
  service-name:
    description: "Name of the service"
    required: true
  registry:
    description: "Docker registry URL"
    required: true
  image-tag:
    description: "Image tag"
    required: true
  registry-username:
    description: "Registry username"
    required: true
  registry-password:
    description: "Registry password"
    required: true

outputs:
  image-full-name:
    description: "Full image name with tag"
    value: ${{ steps.build.outputs.image }}

runs:
  using: "composite"
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to registry
      uses: docker/login-action@v3
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.registry-username }}
        password: ${{ inputs.registry-password }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ inputs.registry }}/${{ github.repository_owner }}/${{ inputs.service-name }}
        tags: |
          type=semver,pattern={{version}},value=${{ inputs.image-tag }}
          type=semver,pattern={{major}}.{{minor}},value=${{ inputs.image-tag }}
          type=semver,pattern={{major}},value=${{ inputs.image-tag }}
          type=raw,value=latest,enable=${{ !contains(inputs.image-tag, '-') }}

    - name: Build and push
      id: build
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ${{ inputs.service-name }}/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          SERVICE_NAME=${{ inputs.service-name }}

    - name: Output image name
      shell: bash
      run: |
        IMAGE="${{ inputs.registry }}/${{ github.repository_owner }}/${{ inputs.service-name }}:${{ inputs.image-tag }}"
        echo "image=$IMAGE" >> $GITHUB_OUTPUT
        echo "🐳 Built image: $IMAGE"
