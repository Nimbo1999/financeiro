name: "Deploy to K3S"
description: "Deploy service to K3S cluster"

inputs:
  service-name:
    description: "Name of the service"
    required: true
  image-tag:
    description: "Docker image tag"
    required: true
  registry-username:
    description: "Registry username"
    required: true
  ssh-host:
    description: "SSH host"
    required: true
  ssh-user:
    description: "SSH user"
    required: true
  ssh-private-key:
    description: "SSH private key"
    required: true
  namespace:
    description: "Kubernetes namespace"
    required: false
    default: "default"

outputs:
  deployment-status:
    description: "Deployment status"
    value: ${{ steps.deploy.outputs.status }}

runs:
  using: "composite"
  steps:
    - name: Setup SSH
      shell: bash
      run: |
        echo "🔐 Setting up SSH..."
        mkdir -p ~/.ssh
        echo "${{ inputs.ssh-private-key }}" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        ssh-keyscan -H ${{ inputs.ssh-host }} >> ~/.ssh/known_hosts

    - name: Deploy to K3S
      id: deploy
      shell: bash
      run: |
        echo "🚀 Deploying ${{ inputs.service-name }} to K3S..."

        IMAGE="${{ inputs.registry-username }}/${{ inputs.service-name }}:${{ inputs.image-tag }}"

        # Update deployment image via SSH
        ssh -i ~/.ssh/deploy_key ${{ inputs.ssh-user }}@${{ inputs.ssh-host }} << EOF
          set -e

          # Check current deployment status
          echo "📊 Current deployment status:"
          kubectl get deployment/${{ inputs.service-name }} -n ${{ inputs.namespace }} || echo "Deployment not found"

          # Check if current image matches desired image
          echo "🔍 Checking current image..."
          CURRENT_IMAGE=\$(kubectl get deployment/${{ inputs.service-name }} \
            -n ${{ inputs.namespace }} \
            -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || echo "")

          if [ "\$CURRENT_IMAGE" = "$IMAGE" ]; then
            echo "⏭️  Deployment already using image: $IMAGE"
            echo "✅ Skipping deployment - image is up to date"
            exit 0
          fi

          echo "🔄 Current image: \$CURRENT_IMAGE"
          echo "🎯 Target image: $IMAGE"

          # Update image in deployment
          echo "🔄 Updating deployment image..."
          kubectl set image deployment/${{ inputs.service-name }} \
            ${{ inputs.service-name }}=$IMAGE \
            -n ${{ inputs.namespace }}

          # If image update fails, you should check the node resources. This was a common issue
          # on previous deployments where nodes ran out of memory.

          # Wait for rollout with extended timeout
          echo "⏳ Waiting for rollout to complete..."
          kubectl rollout status deployment/${{ inputs.service-name }} \
            -n ${{ inputs.namespace }} \
            --timeout=2m

          # Final pod status check
          echo "✅ Final pod status:"
          kubectl get pods -n ${{ inputs.namespace }} -l app=${{ inputs.service-name }}
        EOF

        echo "status=success" >> $GITHUB_OUTPUT
        echo "✅ Deployment completed successfully"

    - name: Cleanup SSH
      if: always()
      shell: bash
      run: |
        rm -f ~/.ssh/deploy_key
